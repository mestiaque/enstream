<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#450A0A" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="274" y1="182" x2="362" y2="330">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="play" gradientUnits="userSpaceOnUse" x1="176" y1="228" x2="230" y2="284">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Letter strokes, reused for depth layers -->
    <g id="strokes" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 182 H150 V330 H230"/>
      <path d="M274 330 V182"/>
      <path d="M362 330 V182"/>
      <path d="M274 182 L362 330"/>
    </g>
    <!-- Stream glyph: play + broadcast waves -->
    <g id="stream" stroke-linecap="round" stroke-linejoin="round">
      <path d="M180 242 L180 270 L201 256 Z" stroke-width="8"/>
      <path d="M214 239 A22 22 0 0 1 214 273" fill="none" stroke-width="8"/>
      <path d="M224 228 A36 36 0 0 1 224 284" fill="none" stroke-width="8"/>
    </g>
  </defs>

  <!-- Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Soft colour blobs behind the glass -->
  <g clip-path="url(#clip)" filter="url(#blobBlur)">
    <circle cx="130" cy="120" r="140" fill="#FB923C" opacity="0.6"/>
    <circle cx="410" cy="410" r="160" fill="#A855F7" opacity="0.55"/>
  </g>

  <!-- Glass panel -->
  <g filter="url(#glassShadow)">
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#FFFFFF" fill-opacity="0.14"
          stroke="url(#glassStroke)" stroke-width="2.5"/>
  </g>
  <path d="M156 72 H356 A84 84 0 0 1 440 156 V200 H72 V156 A84 84 0 0 1 156 72 Z" fill="url(#shine)"/>

  <!-- Subtle 3D: soft shadow + translucent depth -->
  <use href="#strokes" stroke="#1E1B4B" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#strokes" stroke="#7F1D1D" opacity="0.55" transform="translate(0 7)"/>

  <!-- EN front faces -->
  <g filter="url(#glow)" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 182 H150 V330 H230" stroke="#FFFFFF"/>
    <path d="M274 330 V182" stroke="#FFFFFF"/>
    <path d="M362 330 V182" stroke="#FFFFFF"/>
    <!-- Folded ribbon diagonal -->
    <path d="M274 182 L362 330" stroke="url(#fold)"/>
  </g>
  <!-- Play + waves as the E's middle bar -->
  <use href="#stream" fill="#7F1D1D" stroke="#7F1D1D" opacity="0.55" transform="translate(0 6)"/>
  <use href="#stream" fill="url(#play)" stroke="url(#play)" filter="url(#glow)"/>
</svg>
