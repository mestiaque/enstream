<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131315" />
    <title>ENStream</title>
    <link rel="icon" href="/static/assets/enstream-icon.svg?v={{VERSION}}" type="image/svg+xml" />
    <script src="/static/js/theme.js?v={{VERSION}}"></script>
    <link rel="stylesheet" href="/static/css/app.css?v={{VERSION}}" />
    <link rel="modulepreload" href="/static/js/app.js?v={{VERSION}}" />
  </head>
  <body>
    <a class="skip" href="#view">Skip to content</a>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="Main">
        <a class="brand" href="/" data-link>
          <img src="/static/assets/enstream-icon.svg?v={{VERSION}}" alt="" width="24" height="24" draggable="false" />
          <span>ENStream</span>
        </a>
        <nav class="nav" id="nav"></nav>
      </aside>
      <div class="column">
        <header class="topbar" id="topbar">
          <div class="tb-left" id="tb-left"></div>
          <div class="tb-title" id="tb-title"></div>
          <form class="search" id="search-form" role="search">
            <span class="search-icon" id="search-icon"></span>
            <input id="search" type="search" placeholder="Search videos…" autocomplete="off" spellcheck="false" aria-label="Search videos" maxlength="200" />
          </form>
          <div class="tb-right" id="tb-right"></div>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
        <footer class="statusbar" id="statusbar">
          <span id="status-left"></span>
          <span class="grow"></span>
          <span id="status-right"></span>
        </footer>
      </div>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Main"></nav>
    <div class="scrim" id="scrim" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">ENStream needs JavaScript to show your library.</p></noscript>
    <script type="module" src="/static/js/app.js?v={{VERSION}}"></script>
  </body>
</html>
